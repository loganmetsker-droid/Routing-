services:
  - type: keyvalue
    name: trovan-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: trovan-backend
    runtime: node
    plan: standard
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build --workspace=backend
    preDeployCommand: npm run migrate --workspace=backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRICT_ENV_VALIDATION
        value: "true"
      - key: REQUIRE_COMPLETE_PILOT_CONFIG
        value: "true"
      - key: PORT
        value: "10000"
      - key: AUTH_PROVIDER
        value: workos
      - key: ALLOW_LOCAL_AUTH
        value: "false"
      - key: AUTH_SESSION_ENFORCEMENT
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: QUEUE_REQUIRED
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: LAUNCH_PROFILE
        value: assisted-pilot
      - key: SELF_SERVE_BILLING_ENABLED
        value: "false"
      - key: SMS_NOTIFICATIONS_ENABLED
        value: "false"
      - key: ROUTING_SERVICE_HOSTPORT
        fromService:
          name: trovan-routing-service
          type: web
          property: hostport
      - key: ROUTING_SERVICE_INTERNAL_TOKEN
        sync: false
      - key: GEOCODING_PROVIDER
        value: mapbox
      - key: GEOCODING_API_KEY
        sync: false
      - key: GEOCODING_COUNTRY
        value: us
      - key: GEOCODING_TIMEOUT_MS
        value: "5000"
      - key: ERROR_MONITORING_WEBHOOK_URL
        sync: false
      - key: ERROR_MONITORING_WEBHOOK_TOKEN
        sync: false
      - key: ACCESS_CODE_ENCRYPTION_KEY
        sync: false
      - key: ACCESS_CODE_KEY_VERSION
        value: pilot-v1
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: WEBHOOK_MAX_RESPONSE_BODY_BYTES
        value: "65536"
      - key: DATABASE_URL
        fromDatabase:
          name: trovan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: trovan-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_REDIRECT_URI
        sync: false
      - key: WORKOS_LOGOUT_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_LAUNCH
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: POSTMARK_WEBHOOK_USERNAME
        sync: false
      - key: POSTMARK_WEBHOOK_PASSWORD
        sync: false
      - key: POSTMARK_BOUNCE_HASH_KEY
        sync: false
      - key: LEAD_INTAKE_EMAIL
        sync: false
      - key: LEAD_INTAKE_FROM_EMAIL
        sync: false
      - key: STORAGE_MODE
        value: r2
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false

  - type: web
    name: trovan-routing-service
    runtime: docker
    rootDir: routing-service
    plan: standard
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: ROUTING_SERVICE_ENV
        value: production
      - key: ROUTING_SERVICE_INTERNAL_TOKEN
        sync: false
      - key: ROUTING_SERVICE_MAX_BODY_BYTES
        value: "1048576"
      - key: ROUTING_MATRIX_PROVIDER
        value: osrm
      - key: ROUTING_MATRIX_BASE_URL
        sync: false
      - key: ROUTING_MATRIX_PROVIDER_LABEL
        value: contracted-osrm
      - key: ROUTING_MATRIX_TOKEN
        sync: false
      - key: ROUTING_MATRIX_TIMEOUT_SECONDS
        value: "8"
      - key: ROUTING_MATRIX_ALLOW_FALLBACK
        value: "false"
      - key: TROVAN_SOLVER_VERSION
        value: ortools-v2-road-matrix
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: trovan-postgres
    databaseName: trovan_staging
    user: trovan_app
    plan: basic-256mb
    ipAllowList: []
