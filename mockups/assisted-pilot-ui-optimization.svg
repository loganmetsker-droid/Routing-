<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Trovan assisted-pilot UI optimization wireframe</title>
  <desc id="desc">Desktop homepage hierarchy, mobile homepage hierarchy, and mobile operational card layout.</desc>
  <defs>
    <style>
      .bg{fill:#f5f2ec}.navy{fill:#0b1324}.panel{fill:#fff;stroke:#d9d4cb;stroke-width:2}.copper{fill:#b97129}.muted{fill:#e8e4dc}.ink{fill:#111827;font:700 18px system-ui}.label{fill:#475569;font:500 14px system-ui}.white{fill:#fff;font:700 18px system-ui}.tiny{fill:#64748b;font:500 12px system-ui}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="ink" x="38" y="42">Desktop public homepage</text>
  <rect class="navy" x="38" y="62" width="650" height="680" rx="18"/>
  <rect fill="#1b263b" x="58" y="82" width="610" height="48" rx="9"/>
  <text class="white" x="78" y="113">TROVAN</text>
  <text class="tiny" x="470" y="111" style="fill:#cbd5e1">Product   Pricing   Demo   Security</text>
  <rect fill="#111c32" x="58" y="150" width="610" height="210" rx="14"/>
  <text class="white" x="82" y="190" style="font-size:29px">Plan the route. Run the day.</text>
  <text class="white" x="82" y="226" style="font-size:29px">Prove every stop.</text>
  <rect class="copper" x="82" y="275" width="110" height="38" rx="8"/>
  <text class="tiny" x="102" y="299" style="fill:#fff;font-weight:700">Book demo</text>
  <rect class="panel" x="350" y="174" width="288" height="155" rx="10"/>
  <text class="tiny" x="370" y="200">Large current product view</text>
  <path d="M375 286 C430 220 495 310 610 226" fill="none" stroke="#b97129" stroke-width="5"/>
  <text class="label" x="58" y="395" style="fill:#f8fafc;font-weight:700">Three route-day outcomes</text>
  <rect class="panel" x="58" y="412" width="190" height="115" rx="10"/>
  <rect class="panel" x="263" y="412" width="190" height="115" rx="10"/>
  <rect class="panel" x="468" y="412" width="200" height="115" rx="10"/>
  <text class="label" x="75" y="442">Plan</text><text class="label" x="280" y="442">Dispatch</text><text class="label" x="485" y="442">Proof</text>
  <rect class="panel" x="58" y="548" width="610" height="94" rx="10"/>
  <text class="label" x="76" y="579">One product flow + one inspectable screenshot</text>
  <rect class="copper" x="76" y="596" width="170" height="26" rx="6"/>
  <rect class="panel" x="58" y="661" width="400" height="60" rx="10"/>
  <rect class="copper" x="478" y="671" width="170" height="40" rx="8"/>
  <text class="tiny" x="508" y="696" style="fill:#fff;font-weight:700">Request onboarding</text>

  <text class="ink" x="728" y="42">Mobile public hierarchy</text>
  <rect class="panel" x="728" y="62" width="200" height="680" rx="22"/>
  <rect class="navy" x="740" y="76" width="176" height="230" rx="14"/>
  <text class="white" x="754" y="110" style="font-size:15px">TROVAN</text>
  <text class="white" x="754" y="150" style="font-size:20px">Plan. Run.</text>
  <text class="white" x="754" y="175" style="font-size:20px">Prove.</text>
  <rect class="copper" x="754" y="205" width="92" height="30" rx="7"/>
  <rect class="panel" x="754" y="246" width="148" height="46" rx="8"/>
  <text class="tiny" x="766" y="273">Product proof</text>
  <text class="label" x="746" y="336">3 outcome cards</text>
  <rect class="muted" x="746" y="350" width="164" height="55" rx="8"/>
  <rect class="muted" x="746" y="414" width="164" height="55" rx="8"/>
  <rect class="muted" x="746" y="478" width="164" height="55" rx="8"/>
  <text class="label" x="746" y="562">Product flow</text>
  <rect class="muted" x="746" y="576" width="164" height="68" rx="8"/>
  <text class="label" x="746" y="674">Pricing + CTA</text>
  <rect class="copper" x="746" y="691" width="164" height="34" rx="8"/>

  <text class="ink" x="960" y="42">Mobile operations</text>
  <rect class="panel" x="960" y="62" width="202" height="680" rx="22"/>
  <text class="label" x="976" y="96">Jobs / Customers</text>
  <rect class="muted" x="976" y="112" width="170" height="40" rx="8"/>
  <rect class="panel" x="976" y="166" width="170" height="118" rx="10"/>
  <text class="label" x="990" y="194">Customer + ID</text>
  <text class="tiny" x="990" y="219">Address and window</text>
  <rect class="copper" x="990" y="239" width="58" height="22" rx="11"/>
  <rect class="panel" x="976" y="296" width="170" height="118" rx="10"/>
  <text class="label" x="990" y="324">Customer + ID</text>
  <text class="tiny" x="990" y="349">Address and window</text>
  <rect class="copper" x="990" y="369" width="58" height="22" rx="11"/>
  <rect class="panel" x="976" y="426" width="170" height="118" rx="10"/>
  <text class="label" x="990" y="454">Customer + ID</text>
  <text class="tiny" x="990" y="479">Address and window</text>
  <rect class="copper" x="990" y="499" width="58" height="22" rx="11"/>
  <rect class="muted" x="976" y="560" width="170" height="42" rx="8"/>
  <text class="tiny" x="1001" y="586">Previous   1 / 3   Next</text>
  <rect class="navy" x="976" y="618" width="170" height="102" rx="10"/>
  <text class="white" x="990" y="646" style="font-size:14px">Selected detail</text>
  <text class="tiny" x="990" y="674" style="fill:#cbd5e1">Open in drawer or</text>
  <text class="tiny" x="990" y="694" style="fill:#cbd5e1">stack below the list</text>
</svg>
