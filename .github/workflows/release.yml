name: Promote Trovan Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        required: true
        options:
          - staging
          - production
      release_sha:
        description: Full commit SHA that passed the release gate
        type: string
        required: true

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '24'

jobs:
  promote:
    name: Promote Immutable SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.target }}

    steps:
      - name: Validate full SHA input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Require successful release and CodeQL gates for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          release_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-cd.yml/runs" \
              -f head_sha="$RELEASE_SHA" \
              -f event="pull_request" \
              -f per_page=100
          )"
          release_gate="$(
            printf '%s' "$release_runs" |
              jq -r --arg sha "$RELEASE_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha)] |
                 sort_by(.created_at) | last | .conclusion // empty'
          )"
          if [ "$release_gate" != "success" ]; then
            echo "No successful Trovan Release Gate run exists for $RELEASE_SHA"
            exit 1
          fi

          check_runs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100"
          )"
          codeql_gate="$(
            printf '%s' "$check_runs" |
              jq -r \
                '[.check_runs[] | select(.name == "CodeQL")] |
                 sort_by(.completed_at) | last | .conclusion // empty'
          )"
          if [ "$codeql_gate" != "success" ]; then
            echo "The PR-level CodeQL check is not successful for $RELEASE_SHA"
            exit 1
          fi

      - name: Require successful staging deployment for production
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          deployment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=staging&ref=${RELEASE_SHA}" \
              --jq '.[0].id // empty'
          )"
          if [ -z "$deployment_id" ]; then
            echo "No staging deployment exists for $RELEASE_SHA"
            exit 1
          fi
          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --jq '.[0].state // empty'
          )"
          if [ "$state" != "success" ]; then
            echo "Staging deployment $deployment_id is not successful: $state"
            exit 1
          fi

      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Confirm checked-out SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck production dependency gate
        run: npm audit --omit=dev --audit-level=high

      - name: Build exact frontend
        env:
          VITE_REST_API_URL: ${{ vars.BACKEND_URL }}
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_WS_URL: ${{ vars.WEBSOCKET_URL }}
          VITE_ENABLE_SOCKETS: 'true'
          VITE_API_TIMEOUT_MS: '8000'
          VITE_RELEASE_SHA: ${{ inputs.release_sha }}
        run: npm run build --workspace=frontend

      - name: Capture current provider versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          mkdir -p release-evidence
          if [ "${{ inputs.target }}" = "staging" ]; then
            npx wrangler@4.114.0 deployments list --env staging > release-evidence/cloudflare-before.txt
          else
            npx wrangler@4.114.0 deployments list > release-evidence/cloudflare-before.txt
          fi
          curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys?limit=5" \
            > release-evidence/render-before.json

      - name: Deploy Render services at exact SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          RENDER_ROUTING_SERVICE_ID: ${{ secrets.RENDER_ROUTING_SERVICE_ID }}
        run: |
          for service_id in "$RENDER_ROUTING_SERVICE_ID" "$RENDER_BACKEND_SERVICE_ID"; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"commitId\":\"$RELEASE_SHA\",\"clearCache\":\"do_not_clear\"}" \
              "https://api.render.com/v1/services/$service_id/deploys"
          done

      - name: Deploy Cloudflare assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.target }}" = "staging" ]; then
            npx wrangler@4.114.0 deploy --env staging
          else
            npx wrangler@4.114.0 deploy
          fi

      - name: Wait for immutable release health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ROUTING_SERVICE_URL: ${{ vars.ROUTING_SERVICE_URL }}
        run: |
          curl --fail --show-error --silent --retry 24 --retry-delay 10 --retry-all-errors \
            "$BACKEND_URL/health/readiness"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors \
            "$ROUTING_SERVICE_URL/health"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors \
            "$FRONTEND_URL"
          curl --fail --show-error --silent --head "$FRONTEND_URL/sitemap.xml" |
            grep -Eiq '^content-type: (application|text)/xml'
          curl --fail --show-error --silent "$FRONTEND_URL/sitemap.xml" |
            grep -q '<urlset'
          curl --fail --show-error --silent --head "$FRONTEND_URL/.well-known/security.txt" |
            grep -Eiq '^content-type: text/plain'
          curl --fail --show-error --silent "$FRONTEND_URL/.well-known/security.txt" |
            grep -q 'Canonical: https://trytrovan.com/.well-known/security.txt'

      - name: Verify every deployed surface reports the exact SHA
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ROUTING_SERVICE_URL: ${{ vars.ROUTING_SERVICE_URL }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          for attempt in $(seq 1 120); do
            backend_sha="$(
              curl -fsS --max-time 20 "$BACKEND_URL/health/runtime" 2>/dev/null |
                jq -r '.runtime.releaseSha // empty'
            )"
            routing_sha="$(
              curl -fsS --max-time 20 "$ROUTING_SERVICE_URL/health" 2>/dev/null |
                jq -r '.release_sha // empty'
            )"
            frontend_sha="$(
              curl -fsS --max-time 20 "$FRONTEND_URL" 2>/dev/null |
                sed -n 's/.*<meta name="trovan-release" content="\([0-9a-f]\{40\}\)".*/\1/p' |
                head -n 1
            )"
            if [ "$backend_sha" = "$RELEASE_SHA" ] &&
               [ "$routing_sha" = "$RELEASE_SHA" ] &&
               [ "$frontend_sha" = "$RELEASE_SHA" ]; then
              echo "Frontend, backend, and routing service all report $RELEASE_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Exact release SHA did not converge before timeout"
              echo "backend=$backend_sha routing=$routing_sha frontend=$frontend_sha expected=$RELEASE_SHA"
              exit 1
            fi
            sleep 10
          done

      - name: Run strict staging smoke
        if: inputs.target == 'staging'
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          STAGING_BACKEND_URL: ${{ vars.BACKEND_URL }}
          STAGING_ROUTING_SERVICE_URL: ${{ vars.ROUTING_SERVICE_URL }}
          STAGING_AUTH_TOKEN: ${{ secrets.STAGING_AUTH_TOKEN }}
          STAGING_DRIVER_AUTH_TOKEN: ${{ secrets.STAGING_DRIVER_AUTH_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          ROUTING_SERVICE_INTERNAL_TOKEN: ${{ secrets.ROUTING_SERVICE_INTERNAL_TOKEN }}
          WORKOS_TEST_EMAIL: ${{ secrets.WORKOS_TEST_EMAIL }}
          WORKOS_TEST_PASSWORD: ${{ secrets.WORKOS_TEST_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_LAUNCH: ${{ secrets.STRIPE_PRICE_LAUNCH }}
          STRIPE_PRICE_SCALE: ${{ secrets.STRIPE_PRICE_SCALE }}
          STAGING_WEBHOOK_RECEIVER_URL: ${{ secrets.STAGING_WEBHOOK_RECEIVER_URL }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          POSTMARK_FROM_EMAIL: ${{ vars.POSTMARK_FROM_EMAIL }}
          LEAD_INTAKE_EMAIL: ${{ vars.LEAD_INTAKE_EMAIL }}
          LEAD_INTAKE_FROM_EMAIL: ${{ vars.LEAD_INTAKE_FROM_EMAIL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: npm run staging:smoke

      - name: Install hosted browser
        if: inputs.target == 'staging'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated hosted Playwright gate
        if: inputs.target == 'staging'
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.FRONTEND_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
          LAUNCH_AUDIT_API_URL: ${{ vars.BACKEND_URL }}
          LAUNCH_AUDIT_AUTH_TOKEN: ${{ secrets.STAGING_AUTH_TOKEN }}
          STAGING_DRIVER_AUTH_TOKEN: ${{ secrets.STAGING_DRIVER_AUTH_TOKEN }}
          LAUNCH_AUDIT_STRICT_OPTIMIZER: 'true'
          LAUNCH_AUDIT_DIR: .tmp/launch-audit/hosted-playwright
          PLAYWRIGHT_OUTPUT_DIR: .tmp/launch-audit/hosted-results
        run: npm run test:e2e -- --project=chromium

      - name: Save deployed evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          if [ "${{ inputs.target }}" = "staging" ]; then
            npx wrangler@4.114.0 deployments list --env staging > release-evidence/cloudflare-after.txt
          else
            npx wrangler@4.114.0 deployments list > release-evidence/cloudflare-after.txt
          fi
          curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys?limit=5" \
            > release-evidence/render-after.json
          printf '%s\n' "${{ inputs.release_sha }}" > release-evidence/release-sha.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-release-${{ inputs.release_sha }}
          path: release-evidence/
          retention-days: 90

      - name: Record successful immutable deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target }}
          ENVIRONMENT_URL: ${{ vars.FRONTEND_URL }}
        run: |
          deployment_id="$(
            jq -n \
              --arg ref "$RELEASE_SHA" \
              --arg environment "$TARGET_ENVIRONMENT" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: ($environment == "production")
              }' |
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/deployments" \
                --input - \
                --jq '.id'
          )"
          jq -n \
            --arg state success \
            --arg environment_url "$ENVIRONMENT_URL" \
            --arg description "Trovan immutable release verified at $RELEASE_SHA" \
            '{
              state: $state,
              environment_url: $environment_url,
              description: $description,
              auto_inactive: true
            }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --input -
