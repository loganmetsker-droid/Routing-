name: Promote Trovan Website

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        required: true
        options:
          - staging
          - production
      release_sha:
        description: Full commit SHA that passed the release gate
        type: string
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RELEASE_SHA: ${{ inputs.release_sha }}
  DEPLOY_TARGET: ${{ inputs.target }}

jobs:
  promote:
    name: Promote Immutable Website SHA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}

    steps:
      - name: Validate full SHA input
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Require successful release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push" \
              --jq '[.workflow_runs[] | select(.name == "Trovan Release Gate")][0].conclusion // empty'
          )"
          if [ "$conclusion" != "success" ]; then
            echo "Trovan Release Gate has not succeeded for $RELEASE_SHA"
            exit 1
          fi

      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Confirm checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require zero high or critical advisories
        run: npm audit --audit-level=high

      - name: Build exact website
        env:
          VITE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: npm run build --workspace=frontend

      - name: Verify website build and launch media
        run: |
          npm run verify:site-build
          npm run verify:launch-media

      - name: Deploy exact SHA to Cloudflare staging
        if: env.DEPLOY_TARGET == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.128.0 deploy --env staging

      - name: Deploy exact SHA to Cloudflare production
        if: env.DEPLOY_TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.128.0 deploy --env=""

      - name: Verify deployed website
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          site_url="$FRONTEND_URL"
          if [ -z "$site_url" ]; then
            if [ "$DEPLOY_TARGET" = "production" ]; then
              site_url="https://trytrovan.com"
            else
              site_url="https://trytrovan-staging.loganmetsker.workers.dev"
            fi
          fi

          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$site_url" > /dev/null
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            "$site_url/api/marketing-leads/health" |
            jq -e '.status == "ready"' > /dev/null
          curl -fsSI "$site_url/sitemap.xml" |
            tr -d '\r' |
            grep -Eiq '^content-type: (application|text)/xml'
          curl -fsS "$site_url/sitemap.xml" | grep -q '<urlset'
          curl -fsSI "$site_url/.well-known/security.txt" |
            tr -d '\r' |
            grep -Eiq '^content-type: text/plain'
          curl -fsS "$site_url/.well-known/security.txt" |
            grep -q 'Canonical: https://trytrovan.com/.well-known/security.txt'
