name: Trovan Release Gate

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  release-gate:
    name: Build, Test, Security, And E2E
    runs-on: ubuntu-latest
    # The exhaustive Playwright control audit intentionally walks every primary
    # route and can take more than 30 minutes on a contended hosted runner.
    # Leave enough headroom for dependency installation and the complete suite;
    # individual test timeouts still fail stalled browser interactions.
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_DB: routing_dispatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d routing_dispatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: routing_dispatch_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      AUTH_PROVIDER: local-config
      ALLOW_LOCAL_AUTH: 'true'
      AUTH_ADMIN_EMAIL: admin@example.com
      AUTH_ADMIN_PASSWORD: ci-only-password
      PLAYWRIGHT_NODE: node

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            routing-service/requirements.txt
            routing-service/requirements-dev.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Exclude generated audit and QA artifacts
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run release:check-scope -- "$RELEASE_BASE_SHA"

      - name: Require zero high or critical advisories
        run: npm audit --audit-level=high

      - name: Check patch whitespace
        run: git diff --check

      - name: Build workspace
        run: npm run build

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Test backend
        run: npm run test --workspace=backend

      - name: Test frontend
        run: npm run test --workspace=frontend -- --run

      - name: Test release and smoke contracts
        run: npm run test:release-scripts

      - name: Verify migrations from an empty database
        run: npm run migration:run --workspace=backend

      - name: Install routing-service test dependencies
        run: pip install -r routing-service/requirements-dev.txt

      - name: Test routing service
        run: python -m pytest routing-service/tests

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright suite
        run: npm run test:e2e -- --project=chromium

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-failure-${{ github.sha }}
          path: |
            .tmp/playwright/
            .codex/launch-audit/
          if-no-files-found: ignore
          retention-days: 14
