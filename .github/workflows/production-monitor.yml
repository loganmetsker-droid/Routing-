name: Trovan Production Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Public Health And Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify website, lead intake, and discovery assets
        env:
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: |
          curl -fsS --max-time 20 "$PRODUCTION_FRONTEND_URL" > /dev/null
          curl -fsS --max-time 20 "$PRODUCTION_FRONTEND_URL/api/marketing-leads/health" |
            jq -e '.status == "ready"' > /dev/null
          content_type="$(
            curl -fsSI --max-time 20 "$PRODUCTION_FRONTEND_URL/sitemap.xml" |
              tr -d '\r' |
              awk -F': ' 'tolower($1) == "content-type" { print tolower($2) }'
          )"
          case "$content_type" in
            *xml*) ;;
            *)
              echo "sitemap.xml has unexpected content type: $content_type"
              exit 1
              ;;
          esac
          curl -fsS --max-time 20 "$PRODUCTION_FRONTEND_URL/sitemap.xml" |
            grep -q '<urlset'
          security_content_type="$(
            curl -fsSI --max-time 20 "$PRODUCTION_FRONTEND_URL/.well-known/security.txt" |
              tr -d '\r' |
              awk -F': ' 'tolower($1) == "content-type" { print tolower($2) }'
          )"
          case "$security_content_type" in
            text/plain*) ;;
            *)
              echo "security.txt has unexpected content type: $security_content_type"
              exit 1
              ;;
          esac
          curl -fsS --max-time 20 "$PRODUCTION_FRONTEND_URL/.well-known/security.txt" |
            grep -q 'Canonical: https://trytrovan.com/.well-known/security.txt'
